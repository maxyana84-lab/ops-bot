# Don't commit real values. Prefer creating the secret from your .env file:
#   kubectl -n ops-bot create secret generic ops-bot --from-env-file=.env
# (or use External Secrets / Sealed Secrets in a real cluster)
apiVersion: v1
kind: Secret
metadata:
  name: ops-bot
  namespace: ops-bot
type: Opaque
stringData:
  TELEGRAM_TOKEN: "123456789:replace-me"
  WEBHOOK_SECRET: "replace-with-openssl-rand-hex-32"
  ALERT_CHAT_IDS: "123456789"
