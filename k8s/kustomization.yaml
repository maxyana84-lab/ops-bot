apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ops-bot

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: ops-bot-targets
    files:
      - targets.yaml

images:
  - name: ghcr.io/OWNER/ops-bot
    newName: ghcr.io/OWNER/ops-bot
    newTag: latest
