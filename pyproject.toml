[project]
name = "ops-bot"
version = "1.0.0"
description = "Telegram bot for infrastructure alerts and service status"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S104"]  # binding to 0.0.0.0 is intended inside a container

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
