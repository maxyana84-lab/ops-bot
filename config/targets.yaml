# Endpoints the bot checks every CHECK_INTERVAL_SECONDS.
# A target is reported DOWN after FAILURE_THRESHOLD consecutive failures,
# and RECOVERED on the first successful check after that.
targets:
  - name: GitHub
    url: https://www.githubstatus.com/api/v2/status.json
  - name: Google
    url: https://www.google.com
    timeout: 3
